name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -A x64
      - name: Bauen
        shell: pwsh
        run: |
          cmake --build build --config Release *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          Select-String -Path build.log -Pattern ': warning ' | Select-Object -Unique -First 40 |
            ForEach-Object { Write-Output "::warning::$($_.Line.Trim())" }
          exit $code
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: PaintClone-x64
          path: build/Release/PaintClone.exe
