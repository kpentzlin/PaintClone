name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Bildschirmfotos des Oberflächentests in den Zweig ci-screens schreiben"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -A x64
      - name: Bauen
        shell: pwsh
        run: |
          cmake --build build --config Release *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          Select-String -Path build.log -Pattern 'src\\.*: warning ' | Select-Object -First 30 |
            ForEach-Object { Write-Output "::warning::$($_.Line.Trim())" }
          exit $code
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: PaintClone-x64
          path: build/Release/PaintClone.exe
      - name: Oberflächentest
        shell: pwsh
        run: ./tests/smoke.ps1 -Exe build/Release/PaintClone.exe
      - name: Oberflächentest der mitgelieferten bin/PaintClone.exe
        shell: pwsh
        run: ./tests/smoke.ps1 -Exe bin/PaintClone.exe
      - name: Bildschirmfotos veröffentlichen
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path screens)) { exit 0 }
          Copy-Item -Recurse screens $env:RUNNER_TEMP\screens
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screens
          git rm -rf --quiet .
          Remove-Item -Recurse -Force build, screens -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\screens\*.png .
          git add *.png
          git commit -m "Bildschirmfotos ${{ github.sha }}"
          git push -f origin ci-screens
